name: Bug report
description: Something in the app or the bridge does not work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **do not** include API keys, bearer tokens, pairing codes, personal hostnames, or your real gateway address anywhere below — redact them as `<REDACTED>`.

        If this is a **security** issue, stop and use the private channel described in `SECURITY.md` instead of opening an issue.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (those go through the private channel in SECURITY.md)
          required: true
        - label: I removed all secrets, tokens, and personal hostnames from this report
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the problem show up?
      options:
        - App — Chat
        - App — Channels / session history
        - App — Cron
        - App — Voice (push-to-talk)
        - App — Pairing / connection setup
        - App — Identity / themes / language
        - App — build or install
        - Bridge — pairing redemption
        - Bridge — voice relay (transcribe / speak)
        - Docs
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version from More → About, or the commit SHA if you built from source
      placeholder: "0.4.4 / commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: How are you running it?
      options:
        - Android device, Tailscale
        - Android device, direct HTTPS
        - Android emulator (x86_64)
        - Development build via expo run:android
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pair with a one-time code
        2. Open the Voice tab
        3. Tap the orb and speak
        4. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        App logs: `adb logcat -d | grep -iE "hermes|FATAL EXCEPTION"` (redact tokens).
        Bridge logs: the uvicorn output or the process log.
        Paste only the lines around the failure — and redact anything secret.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, whether it is reproducible, and whether it started after a specific change
    validations:
      required: false